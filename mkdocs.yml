site_name: Kevin Ortega — Proyectos
site_description: Documentación técnica de proyectos en robótica, control y visión por computador
site_author: Kevin Ortega
site_url: https://kevin-ortega2724.github.io/
repo_url: https://github.com/kevin-ortega2724
repo_name: kevin-ortega2724

theme:
  name: readthedocs
  highlightjs: true
  collapse_navigation: false
  titles_only: false
  navigation_depth: 4
  sticky_navigation: true

nav:
  - Inicio: index.md
  - Proyectos:
      - Filtrado de Kalman: proyectos/kalman.md
      - Manipulador Paralelo 2RRR: proyectos/manipulador-2rrr.md
      - Ajuste de Cónicas: proyectos/conic.md
      - Visión por Computador: proyectos/vision-computador.md
      - Repositorio ROS: proyectos/repositorio-ros.md
  - Sobre mí: sobre-mi.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
